name: Update Articles

on:
  schedule:
  - cron:  '*/1 * * * *'
  workflow_dispatch:

# Shares the group with jekyll.yml so the two workflows never deploy at once.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Check repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python Version
        uses: actions/setup-python@v2
        with:
          python-version: 3.9

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4
          pip install markdownify

      - name: execute script
        id: scrape
        run: python ./scripts/update-episodes.py

      - name: setup git config
        run: |
          git config --global user.name 'arickert'
          git config --global user.email 'andysrickert@gmail.com'
      - name: commit
        run: |
          git add --all
          git commit -am "Created and updated archive files." || echo "No changes to commit."
          git push

      # Compares HEAD against the commit the live site was built from, so any
      # commit that never made it out (failed build, or a bot push, which does
      # not trigger jekyll.yml) gets picked up on a later run.
      - name: Check whether the live site is stale
        id: check
        run: |
          head_sha="$(git rev-parse HEAD)"
          live_sha="$(curl -fsSL "https://thedigradio.com/build-sha.txt?cb=$GITHUB_RUN_ID" | tr -d '[:space:]' || true)"
          echo "HEAD=$head_sha  live=${live_sha:-<unavailable>}"
          if [ "$head_sha" = "$live_sha" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Live site is current; skipping build and deploy."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "Live site is behind HEAD; rebuilding."
          fi

      # Same pin as jekyll.yml: better-sqlite3 fails to compile on newer Node.
      - name: Setup Node
        if: steps.check.outputs.stale == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Ruby
        if: steps.check.outputs.stale == 'true'
        uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        if: steps.check.outputs.stale == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Tina
        if: steps.check.outputs.stale == 'true'
        run: yarn install --frozen-lock && yarn tinacms build && bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
            TINA_PUBLIC_CLIENT_ID: ${{ secrets.TINA_PUBLIC_CLIENT_ID }}
            TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
            TINA_SEARCH: ${{ secrets.TINA_SEARCH }}
            JEKYLL_ENV: production
      - name: Record build SHA
        if: steps.check.outputs.stale == 'true'
        run: git rev-parse HEAD > _site/build-sha.txt

      - name: Upload artifact
        if: steps.check.outputs.stale == 'true'
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3
    permissions:
      id-token: write
      contents: write

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.stale == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          timeout: 1800000
    permissions:
      id-token: write
      pages: write

